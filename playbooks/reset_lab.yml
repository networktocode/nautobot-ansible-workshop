---
# Reset the mutable state a lab leaves behind, so an attendee can start
# cleanly at the beginning of any lab.
#
# Normally run by the workshop's reset tooling rather than by hand. That
# tooling also restores the git working tree (group_vars, nautobot.yml,
# templates, jobs/, rendered/), which this playbook does not touch.
#
# ---------------------------------------------------------- scope
#
# A reset is split three ways:
#   reset tooling      the git working tree
#   seed_nautobot.yml  Nautobot objects, via `--tags reset`
#   this playbook      1. write-back state on the devices (Labs 3 and 4)
#                      2. the AWX Job Template's Inventory field (Lab 1e)
#                         and its survey switch (Lab 2h)
#
# It creates nothing: every object exists from provisioning, and the labs only
# change existing objects. It never rebuilds AWX, and it does not run
# seed_awx.yml, which takes minutes and issues a new AWX token that the Lab 4
# webhook would then need re-pointed to.
#
# HOW TO RUN:
#   ansible-playbook playbooks/reset_lab.yml -e lab=2
#
# Tested with Nautobot 3.2.3 and AWX 24.6.1.

- name: Reset mutable lab state
  hosts: localhost
  connection: local
  gather_facts: false

  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ awx_url }}"
      controller_username: "{{ awx_username }}"
      controller_password: "{{ awx_password }}"
      validate_certs: false

  vars:
    # Literal workshop defaults, each optionally overridden by an environment
    # variable, as in both seed playbooks.
    nb_url: "{{ lookup('env', 'NAUTOBOT_URL') | default('http://localhost:8001', true) }}"
    nb_token: "{{ lookup('env', 'NAUTOBOT_TOKEN') | default('0123456789abcdef0123456789abcdef01234567', true) }}"
    awx_url: "{{ lookup('env', 'CONTROLLER_HOST') | default('http://localhost:8013', true) }}"
    awx_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
    awx_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('admin', true) }}"

    devices: [leaf1, leaf2]

    # The two settings that vary by lab, both on the `Onboard Site (survey)`
    # job template. Lab 1e repoints it from the static inventory to the
    # Nautobot-backed one, so Labs 0-1 expect `Static (Lab 0)` and Labs 2-4
    # expect `Nautobot (Lab 1)`. Lab 2h switches its survey off, so Labs 0-2
    # expect the survey on and Labs 3-4 expect it off.
    inventory_for_lab:
      "0": Static (Lab 0)
      "1": Static (Lab 0)
      "2": Nautobot (Lab 1)
      "3": Nautobot (Lab 1)
      "4": Nautobot (Lab 1)

  tasks:
    - name: Refuse an unknown lab number
      ansible.builtin.assert:
        that: lab | default('') | string in inventory_for_lab
        fail_msg: >-
          Pass a lab number: -e lab=0 through -e lab=4. Got
          '{{ lab | default("nothing") }}'.
        success_msg: "Resetting to the start of lab {{ lab }}."

    # -------------------------------------------------- Nautobot: write-back state
    # Labs 3d and 4 write discovered state onto the device records. The seed
    # does not clear it, because `networktocode.nautobot.device` only sets the
    # fields it is given. `serial: ""` rather than null: the field is a
    # CharField that rejects null.
    - name: Clear the state Lab 3 and Lab 4 wrote back
      ansible.builtin.uri:
        url: "{{ nb_url }}/api/dcim/devices/?name={{ item }}"
        method: GET
        headers: &nb_headers
          Authorization: "Token {{ nb_token }}"
          Accept: application/json
          Content-Type: application/json
        status_code: 200
      register: dev_lookup
      loop: "{{ devices }}"
      changed_when: false

    - name: Blank serial, software version and the custom fields
      ansible.builtin.uri:
        url: "{{ nb_url }}/api/dcim/devices/{{ (item.json.results | first).id }}/"
        method: PATCH
        headers: *nb_headers
        body_format: json
        body:
          serial: ""
          software_version: null
          custom_fields:
            awx_job_id: null
            lldp_neighbors: {}
        status_code: 200
      loop: "{{ dev_lookup.results }}"
      loop_control:
        label: "{{ (item.json.results | first).name }}"
      when: (item.json.results | default([])) | length == 1

    # ------------------------------------------------------ AWX: the inventory flip
    - name: Set the survey job template's inventory and survey as this lab expects
      awx.awx.job_template:
        name: Onboard Site (survey)
        organization: Default
        inventory: "{{ inventory_for_lab[lab | string] }}"
        survey_enabled: "{{ (lab | int) <= 2 }}"
        state: present

    # Re-sync so the Nautobot inventory's hosts are current rather than left
    # stale by a previous attempt.
    - name: Re-sync the Nautobot inventory source
      awx.awx.inventory_source_update:
        name: nautobot.yml
        inventory: Nautobot (Lab 1)
        organization: Default
        wait: true
        timeout: 120
      when: (lab | int) >= 1

    - name: Report
      ansible.builtin.debug:
        msg:
          - "Reset to the start of lab {{ lab }}."
          - "Job template inventory: {{ inventory_for_lab[lab | string] }}"
          - "Write-back state cleared on: {{ devices | join(', ') }}"
          - "⚠️ Device CONFIG is untouched — see reset.sh --devices if lab 2's diff needs to show drift."
