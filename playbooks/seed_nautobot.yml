---
# Populate Nautobot with the workshop topology, plus the objects the labs use.
#
# Runs against localhost and talks to Nautobot's REST API through the
# networktocode.nautobot modules. It never connects to leaf1/leaf2, so the
# devices do not need to be running.
#
# HOW TO RUN:
#   ansible-playbook playbooks/seed_nautobot.yml
#
# No -i (the play targets localhost) and no -u/-k (auth is the API token).
#
# NAUTOBOT_URL and NAUTOBOT_TOKEN are optional overrides. The defaults are the
# workshop's fixed URL and pinned token, so the playbook does not depend on
# shell state that a new SSH session or non-interactive shell would lose.
#
# Idempotent and safe to re-run.
#
# Order matters. Nautobot enforces referential integrity, so parents come first:
#   LocationType → Location → Manufacturer → Platform → DeviceType → Role
#   → Device → Interface → Prefix → IPAddress → bind IP → set primary_ip4

- name: Seed Nautobot with the workshop topology
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # YAML anchor: the collection defines no module_defaults action group, so
    # url/token must be passed to every task. `<<: *nb` merges them in.
    #
    # `| default(x, true)`: an unset env var comes back as an empty string, not
    # undefined, so the second argument is needed for the default to apply.
    nb: &nb
      url: "{{ lookup('env', 'NAUTOBOT_URL') | default('http://localhost:8001', true) }}"
      token: "{{ lookup('env', 'NAUTOBOT_TOKEN') | default('0123456789abcdef0123456789abcdef01234567', true) }}"

    site_name: DC1
    mgmt_prefix: 172.20.20.0/24
    mgmt_interface: Management0

    # Nautobot clones this itself to discover the Jobs in jobs/, so it must be
    # a URL Nautobot's worker can reach, not a local path.
    lab_repo_url: https://github.com/networktocode/nautobot-ansible-workshop.git
    lab_repo_branch: main

    # mgmt_ip must match the pinned mgmt-ipv4 values in clab/workshop.clab.yml.
    # Lab 1's dynamic inventory builds ansible_host from primary_ip4, so a
    # mismatch sends every playbook to the wrong address without an error.
    #
    # leaf2 is seeded as Planned, not Active. Lab 4 has the attendee set it to
    # Active; that edit must be a real change to produce the change-log entry
    # and webhook that start the `Site Turnup (gated)` workflow.
    workshop_devices:
      - name: leaf1
        status: Active
        mgmt_ip: 172.20.20.11/24
        eth1_description: to leaf2 Ethernet1
      - name: leaf2
        status: Planned
        mgmt_ip: 172.20.20.12/24
        eth1_description: to leaf1 Ethernet1

    # ---------------------------------------------------------- Lab 2 content
    # Same keys as inventory/group_vars/leaf.yml, deliberately. Lab 2 removes
    # that file and the playbook keeps working because Nautobot serves these.
    leaf_base_context:
      ntp_servers:
        - 10.0.0.1
        - 10.0.0.2
      dns_servers:
        - 10.0.0.53
      snmp_community: public
      mgmt_vrf: MGMT
      syslog_host: 10.0.0.10

    # JSON Schema for the above. Lab 2d sets ntp_servers to a plain string and
    # Nautobot rejects it, so the array constraint is the part that matters.
    leaf_base_schema:
      title: leaf-base
      type: object
      properties:
        ntp_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: ipv4
        dns_servers:
          type: array
          minItems: 1
          items:
            type: string
            format: ipv4
        snmp_community:
          type: string
          minLength: 1
        mgmt_vrf:
          type: string
        syslog_host:
          type: string
          format: ipv4
      required:
        - ntp_servers

  tasks:
    # Pre-flight check. Querying the authenticated API root catches both an
    # unreachable Nautobot and a bad token in one call; 401/403 means the token.
    - name: Check Nautobot is reachable and the token works
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/"
        method: GET
        headers:
          Authorization: "Token {{ nb.token }}"
          Accept: application/json
        timeout: 10
      register: nb_ping
      failed_when: false
      changed_when: false

    - name: Explain it if Nautobot is not answering
      ansible.builtin.assert:
        that: nb_ping.status == 200
        fail_msg: >-
          Nautobot at {{ nb.url }} returned {{ nb_ping.status }}.
          401/403 means the API token is wrong — check it against
          nautobot-ansible-workshop-instructor/00-credentials-and-addressing.md, or export NAUTOBOT_TOKEN to
          override. Anything else (-1, 000, 502) means Nautobot is not up:
          `cd ~/nautobot-docker-compose && docker compose ps` and give it a
          minute if it is still migrating.
        success_msg: "Nautobot answering at {{ nb.url }}"

    # ------------------------------------------------- custom fields (Lab 3)
    # Written to by playbooks/write_back.yml. `key` is the programmatic name
    # that `custom_fields:` refers to when writing values.
    - name: Custom field — AWX job ID
      networktocode.nautobot.custom_field:
        <<: *nb
        key: awx_job_id
        label: AWX Job ID
        type: text
        content_types:
          - dcim.device
        description: >-
          Set by playbooks/write_back.yml. Links this device to the AWX job that
          last touched it — the correlation Lab 4 closes the loop on.
        state: present

    - name: Custom field — discovered LLDP neighbors
      networktocode.nautobot.custom_field:
        <<: *nb
        key: lldp_neighbors
        label: LLDP Neighbors (discovered)
        type: json
        content_types:
          - dcim.device
        description: >-
          Discovered at runtime and written back. A JSON field rather than real
          Cable objects on purpose — see write_back.yml for the reasoning.
        state: present

    # ---------------------------------------------------------------- location
    - name: Location type
      networktocode.nautobot.location_type:
        <<: *nb
        name: Site
        content_types:
          - dcim.device
        state: present

    - name: Location
      networktocode.nautobot.location:
        <<: *nb
        name: "{{ site_name }}"
        location_type: Site
        status: Active
        state: present

    # ------------------------------------------------------------ device model
    - name: Manufacturer
      networktocode.nautobot.manufacturer:
        <<: *nb
        name: Arista
        state: present

    - name: Platform
      networktocode.nautobot.platform:
        <<: *nb
        name: Arista EOS
        manufacturer: Arista
        # netutils driver name, not an Ansible network_os. The inventory sets
        # ansible_network_os in inventory/group_vars/all.yml instead.
        network_driver: arista_eos
        state: present

    - name: Device type
      networktocode.nautobot.device_type:
        <<: *nb
        model: cEOSLab
        manufacturer: Arista
        u_height: 1
        state: present

    # Registered because the Config Context below is scoped to this role and
    # needs its UUID.
    - name: Role
      networktocode.nautobot.role:
        <<: *nb
        name: leaf
        content_types:
          - dcim.device
        state: present
      register: role_leaf

    # ----------------------------------------------------------------- devices
    - name: Devices
      networktocode.nautobot.device:
        <<: *nb
        name: "{{ item.name }}"
        device_type: cEOSLab
        role: leaf
        platform: Arista EOS
        location: "{{ site_name }}"
        status: "{{ item.status }}"
        state: present
      loop: "{{ workshop_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # -------------------------------------------------------------------- IPAM
    # IPAM comes before the interfaces, because the interface task binds the
    # addresses inline and they must already exist. IPs live in a Namespace;
    # "Global" ships by default.
    - name: Management prefix
      networktocode.nautobot.prefix:
        <<: *nb
        prefix: "{{ mgmt_prefix }}"
        namespace: Global
        status: Active
        state: present

    - name: Management IP addresses
      networktocode.nautobot.ip_address:
        <<: *nb
        address: "{{ item.mgmt_ip }}"
        namespace: Global
        status: Active
        state: present
      loop: "{{ workshop_devices }}"
      loop_control:
        label: "{{ item.mgmt_ip }}"

    # Creates each interface and binds its IP in one task. The `ip_addresses`
    # option (collection 6.2.0+) replaces the deprecated ip_address_to_interface
    # module, which has no `device` parameter to tell leaf1's Management0 from
    # leaf2's.
    #
    # `state: replace` rather than the default `merge`: merge only adds, so a
    # changed address would leave the old one bound too. GraphQL returns every
    # bound IP, and full_config.j2 would render the stale one into the intent.
    - name: Management interfaces (with IPs bound)
      networktocode.nautobot.device_interface:
        <<: *nb
        device: "{{ item.name }}"
        name: "{{ mgmt_interface }}"
        type: 1000base-t
        mgmt_only: true
        status: Active
        ip_addresses:
          state: replace
          objects:
            - ip_address: "{{ item.mgmt_ip }}"
        state: present
      loop: "{{ workshop_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # A data interface, so the rendered intent has an interface to describe.
    # full_config.j2 skips mgmt_only interfaces, so without this the interface
    # section would be empty. No IP: leaf1:eth1 <-> leaf2:eth1 is a plain L2 link.
    - name: Data interfaces
      networktocode.nautobot.device_interface:
        <<: *nb
        device: "{{ item.name }}"
        name: Ethernet1
        type: 1000base-t
        mgmt_only: false
        enabled: true
        status: Active
        description: "{{ item.eth1_description }}"
        state: present
      loop: "{{ workshop_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # Must come last: the IP has to exist and be bound before it can be primary.
    # The dynamic inventory builds ansible_host from primary_ip4, so without
    # this Lab 1 produces hosts with no address.
    - name: Set primary IPv4
      networktocode.nautobot.device:
        <<: *nb
        name: "{{ item.name }}"
        primary_ip4: "{{ item.mgmt_ip }}"
        state: present
      loop: "{{ workshop_devices }}"
      loop_control:
        label: "{{ item.name }}"

    # ------------------------------------------- Dynamic Group (Lab 1c)
    # `dynamic-filter` computes membership from `filter`. Filter values are
    # lists because the syntax mirrors the REST API's multi-valued query
    # parameters.
    - name: Dynamic Group — leaf devices at DC1
      networktocode.nautobot.dynamic_group:
        <<: *nb
        name: leaf-devices-dc1
        group_type: dynamic-filter
        content_type: dcim.device
        description: >-
          Lab 1c targets this group by name. Membership is a live query, not a
          list — add a device matching the filter and it appears here.
        filter:
          role:
            - leaf
          location:
            - "{{ site_name }}"
        state: present

    # ------------------------------------------- Config Context (Lab 2)
    # networktocode.nautobot 6.2.0 has no module for Config Contexts or their
    # Schemas, so both go through the REST API. Idempotent by name: look up
    # first, then POST or PATCH. The `roles` scope takes extras.Role IDs.
    - name: Look up the Config Context Schema
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/config-context-schemas/?name=leaf-base-schema"
        method: GET
        headers: &nb_headers
          Authorization: "Token {{ nb.token }}"
          Accept: application/json
        status_code: 200
      register: schema_lookup

    - name: Config Context Schema — leaf-base-schema
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/config-context-schemas/{{
          (schema_lookup.json.results | first).id ~ '/' if schema_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if schema_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: leaf-base-schema
          description: >-
            Validates leaf-base. Lab 2d proves this rejects a bad ntp_servers
            before it can reach a device.
          data_schema: "{{ leaf_base_schema }}"
        status_code: [200, 201]
      register: schema_result

    - name: Look up the Config Context
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/config-contexts/?name=leaf-base"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: context_lookup

    - name: Config Context — leaf-base
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/config-contexts/{{
          (context_lookup.json.results | first).id ~ '/' if context_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if context_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: leaf-base
          weight: 1000
          is_active: true
          description: >-
            Serves the variables that inventory/group_vars/leaf.yml used to
            hold. Scoped to the role, not to devices — any new leaf inherits it.
          config_context_schema: "{{ schema_result.json.id }}"
          # Scoped to a role, not to individual devices.
          roles:
            - "{{ role_leaf.role.id }}"
          data: "{{ leaf_base_context }}"
        status_code: [200, 201]

    # ------------------------------------------- Secrets Group (Lab 3c)
    # Lab 3c compares how Nautobot and AWX hold device credentials. The secret
    # is an environment-variable reference: Nautobot stores a pointer to the
    # secret, not the secret itself. The variable need not exist for the lab.
    - name: Secret — device password reference
      networktocode.nautobot.secret:
        <<: *nb
        name: cEOS admin password
        provider: environment-variable
        parameters:
          variable: NAPALM_PASSWORD
        description: >-
          A pointer, not a password. Nautobot resolves this at use time from the
          worker's environment — the value never lives in the database.
        state: present

    - name: Secrets Group — cEOS device access
      networktocode.nautobot.secrets_group:
        <<: *nb
        name: cEOS device access
        description: >-
          Lab 3c compares this with the AWX Machine credential. Same job, two
          places it could live — see the lab for why picking one matters.
        state: present

    - name: Bind the secret into the group
      networktocode.nautobot.secrets_groups_association:
        <<: *nb
        secrets_group: cEOS device access
        secret: cEOS admin password
        access_type: Generic
        secret_type: password
        state: present

    # ------------------------------------------- Git Repository + Jobs (Lab 3a)
    # Imports the Job behind the "Run in AWX" button on a device page. No
    # git_repository module exists in networktocode.nautobot 6.2.0, so this
    # uses the REST API with the same look-up-then-POST-or-PATCH pattern.
    - name: Look up the Git Repository
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/git-repositories/?name=nautobot-ansible-workshop"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: repo_lookup

    - name: Git Repository — the lab repo, providing jobs
      ansible.builtin.uri:
        url: >-
          {{ nb.url }}/api/extras/git-repositories/{{
          (repo_lookup.json.results | first).id ~ '/' if repo_lookup.json.count > 0 else '' }}
        method: "{{ 'PATCH' if repo_lookup.json.count > 0 else 'POST' }}"
        headers: *nb_headers
        body_format: json
        body:
          name: nautobot-ansible-workshop
          remote_url: "{{ lab_repo_url }}"
          branch: "{{ lab_repo_branch }}"
          provided_contents:
            - extras.job
        status_code: [200, 201]
      register: repo_result

    # A POST to /sync/ enqueues a Celery task and returns immediately, so
    # success here means "accepted", not "completed".
    - name: Sync the Git Repository
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/git-repositories/{{ repo_result.json.id }}/sync/"
        method: POST
        headers: *nb_headers
        status_code: [200, 201, 202]
      register: sync_request

    # Follow the sync's JobResult rather than only polling for the Job, so a
    # failed clone, an import error or a stopped worker is reported as such.
    - name: Wait for the sync to finish
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/job-results/{{ sync_request.json.job_result.id }}/"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: sync_result
      until: (sync_result.json.status.value | default(sync_result.json.status)) in ['SUCCESS', 'FAILURE', 'REVOKED']
      retries: 24
      delay: 5

    # A result stuck on PENDING means the Celery worker is not consuming the
    # queue; the repository itself is fine.
    - name: Report the sync outcome
      ansible.builtin.assert:
        that:
          - (sync_result.json.status.value | default(sync_result.json.status)) == 'SUCCESS'
        fail_msg: >-
          Git repository sync did not succeed — status
          {{ sync_result.json.status.value | default(sync_result.json.status) }}.
          Read the log at {{ nb.url }}/extras/job-results/{{ sync_request.json.job_result.id }}/
          If it never left PENDING, the celery worker is not running.

    - name: Wait for the Job to be imported
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/jobs/?name=Launch%20AWX%20job%20for%20this%20device"
        method: GET
        headers: *nb_headers
        status_code: 200
      register: job_lookup
      until: job_lookup.json.count > 0
      retries: 6
      delay: 5

    # If the sync succeeded but no Job appeared, jobs/ is missing from the
    # repository root or failed to import. The sync's JobResult log has the
    # traceback.
    - name: Explain a successful sync that imported no Job
      ansible.builtin.assert:
        that:
          - job_lookup.json.count > 0
        fail_msg: >-
          Sync succeeded but no Job named "Launch AWX job for this device"
          exists. Either jobs/ is missing from the pushed repository, or the
          module raised on import. The traceback is in the sync log:
          {{ nb.url }}/extras/job-results/{{ sync_request.json.job_result.id }}/

    # Jobs are imported disabled, and Nautobot will not run one until it is
    # enabled. The Job Button gives no indication of this on its own.
    - name: Enable the Job
      ansible.builtin.uri:
        url: "{{ nb.url }}/api/extras/jobs/{{ (job_lookup.json.results | first).id }}/"
        method: PATCH
        headers: *nb_headers
        body_format: json
        body:
          enabled: true
        status_code: 200

    - name: Job Button — Run in AWX
      networktocode.nautobot.job_button:
        <<: *nb
        name: Run in AWX
        content_types:
          - dcim.device
        job: Launch AWX job for this device
        text: Run in AWX
        button_class: primary
        enabled: true
        confirmation: false
        state: present

    # ------------------------------------------------------------ verification
    - name: Next step
      ansible.builtin.debug:
        msg: >-
          Seeded {{ workshop_devices | length }} devices at {{ site_name }},
          plus Config Context leaf-base (schema-validated) and Dynamic Group
          leaf-devices-dc1. Verify:
          ansible-inventory -i inventory/nautobot.yml --graph
          then: ansible-inventory -i inventory/nautobot.yml --host leaf1 | jq '.ntp_servers'
