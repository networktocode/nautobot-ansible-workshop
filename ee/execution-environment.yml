---
# Custom execution environment for the Nautobot and Ansible workshop.
#
# The stock EE, quay.io/ansible/awx-ee:24.6.1, ships ansible-core 2.15.12 and
# cannot run this workshop's collections:
#
#   networktocode.nautobot   requires_ansible >= 2.17.0
#   arista.eos               requires_ansible >= 2.16.0
#   pynautobot               needed by networktocode.nautobot modules; absent
#
# The Nautobot inventory plugin still works on the stock EE (it uses plain HTTP
# and only warns about the version), so the gap appears only when a playbook
# runs a module. `awx-ee:latest` is not a substitute: it is built from devel,
# so it is not reproducible, and it does not include pynautobot either.
#
# ------------------------------------------------------------------ BUILDING
#
#   /opt/ansible/bin/pip install ansible-builder==3.1.1
#   cd ~/nautobot-ansible-workshop/ee && /opt/ansible/bin/ansible-builder build --tag workshop-ee:1.0.0 --container-runtime docker
#   minikube -p awx image load workshop-ee:1.0.0
#
# Then point AWX at it (playbooks/seed_awx.yml does this), or by hand:
#   Administration -> Execution Environments -> workshop-ee -> Image: workshop-ee:1.0.0
#
# `minikube image load` makes the image available without a registry. For a
# locally loaded image the AWX pull policy must not be "always", or AWX tries
# to fetch workshop-ee:1.0.0 from a registry that does not have it.
# seed_awx.yml sets `pull: missing`.

version: 3

images:
  base_image:
    # Pinned to the same version as AWX. Layering onto it keeps the plumbing
    # AWX expects in an EE, notably the `receptor` binary at /usr/bin/receptor
    # (a Go binary, unaffected by the Python change below).
    name: quay.io/ansible/awx-ee:24.6.1

dependencies:
  # awx-ee:24.6.1 is CentOS Stream 9, whose default /usr/bin/python3 is 3.9.
  # ansible-core 2.18 requires Python >= 3.11, so without this stanza pip
  # reports "No matching distribution found for ansible-core==2.18.19": the
  # version exists, but the interpreter is too old. This is ansible-builder
  # v3's supported way to change the interpreter, and matches upstream awx-ee.
  python_interpreter:
    package_system: python3.12
    python_path: /usr/bin/python3.12

  # Matches the host venv (requirements-host.txt), so a playbook behaves the
  # same whether it is run from the shell or by AWX.
  ansible_core:
    package_pip: ansible-core==2.18.19

  # Reinstalled under Python 3.12 so AWX's entrypoint gets a runner that can
  # import the ansible-core above, rather than the base image's 3.9 copy.
  ansible_runner:
    package_pip: ansible-runner

  system: |
    python3.12-devel [platform:rpm compile]
    gcc [platform:rpm compile]

  # Single source for collections. ansible-builder resolves this path relative
  # to this file, so the EE build and AWX's project sync read the same
  # requirements file. Do not copy it into this directory.
  #
  # Because the collections are baked into the image, AWX does not need to
  # install them at project sync time: no Galaxy credential is required, and
  # stacks do not each reach galaxy.ansible.com when a session starts.
  galaxy: ../collections/requirements.yml

  python:
    # Imported by networktocode.nautobot's modules (not by its inventory plugin).
    - pynautobot==3.1.1
    # Used by arista.eos over network_cli. The inventory sets
    # ansible_network_cli_ssh_type: paramiko, and no collection installs it.
    - paramiko==5.0.0
    # Present in the base under Python 3.9; reinstalled for 3.12.
    - receptorctl

  # Excludes these collections' Python requirements from dependency
  # resolution. The collections themselves stay in the image (they ship in the
  # awx-ee base), so `ansible-galaxy collection list` still shows them.
  #
  # ansible-builder scans every installed collection, including those in the
  # base image, and merges their Python requirements into one pip resolve.
  # azure.azcollection pulls in azure-cli-core, which caps paramiko below
  # 4.0.0, so with paramiko==5.0.0 the resolve fails with ResolutionImpossible.
  # Excluding the unused collections fixes that and shortens the build;
  # relaxing the paramiko pin instead would let the host and the EE diverge.
  #
  # None of these collections is used in the workshop; to use one, remove it
  # from this list. The list follows upstream awx-ee's execution-environment.yml,
  # and naming a collection that is not installed is harmless.
  exclude:
    all_from_collections:
      - amazon.aws
      - ansible.posix
      - ansible.windows
      - awx.awx
      - azure.azcollection
      - community.vmware
      - google.cloud
      - kubernetes.core
      - kubevirt.core
      - openstack.cloud
      - ovirt.ovirt
      - redhatinsights.insights
      - theforeman.foreman

options:
  package_manager_path: /usr/bin/dnf

additional_build_steps:
  append_final:
    # Point a bare `python` at 3.12 (the base leaves it on 3.9), so anything
    # that shells out to `python` can import ansible. Matches upstream awx-ee.
    - RUN alternatives --install /usr/bin/python python /usr/bin/python3.12 312

    # Fail the build, rather than the first job, if the interpreter change did
    # not take effect.
    - RUN /usr/bin/python3.12 -c "import ansible.release, sys; assert ansible.release.__version__ == '2.18.19', ansible.release.__version__; assert sys.version_info[:2] >= (3, 11)"
    - RUN /usr/bin/python3.12 -c "import pynautobot, paramiko"
