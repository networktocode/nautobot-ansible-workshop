---
# Ansible collections for the workshop, read by both the execution environment
# build (ee/execution-environment.yml) and AWX's project sync.
#
# The workshop EE has these baked in. If AWX installs them at project sync time
# instead, the Project's Organization needs a Galaxy credential attached:
#   Access → Organizations → Default → Galaxy Credentials
# Without it the sync succeeds, the collections silently do not install, and
# jobs fail later with:
#   couldn't resolve module/action 'arista.eos.eos_config'
#
# Versions are exact pins, not floors, so every EE build and every project sync
# resolves the same set. They are known to resolve together. To list what a
# built image contains:
#   docker run --rm -e HOME=/tmp --entrypoint ansible-galaxy workshop-ee:1.0.0 collection list

collections:
  - name: arista.eos
    version: "==12.2.0"

  # Used from Lab 1 onward; installed from the start so the collection set is
  # the same for every lab.
  - name: networktocode.nautobot
    version: "==6.2.0"

  # Dependency of arista.eos (which requires >= 8.5.2), pinned here so the
  # network_cli connection plugin version is fixed.
  - name: ansible.netcommon
    version: "==8.6.2"

  # Transitive dependency of ansible.netcommon, pinned for the same reason.
  - name: ansible.utils
    version: "==6.1.0"
