---
# Lab 3: read state from the devices and write it back into Nautobot.
#
# The earlier labs push data from Nautobot to the devices. This playbook goes
# the other way, so the source of truth records what is actually deployed.
#
# Requires playbooks/seed_nautobot.yml to have run first: it creates the
# `awx_job_id` and `lldp_neighbors` custom fields this playbook writes to.
#
# HOW TO RUN:
#   export NAUTOBOT_URL="http://localhost:8001"
#   export NAUTOBOT_TOKEN="<token>"
#   ansible-playbook -i inventory/nautobot.yml playbooks/write_back.yml -u admin -k
#
# Preview without writing anything:
#   ansible-playbook -i inventory/nautobot.yml playbooks/write_back.yml -u admin -k --check --diff
#
# Afterwards, check the change log:
#   Nautobot UI -> Extensibility -> Change Log
# Each device shows an update attributed to the token's user, carrying the AWX
# job ID. Lab 4 builds on that correlation.

- name: Write discovered state back to Nautobot
  hosts: all
  gather_facts: false

  vars:
    nb: &nb
      url: "{{ lookup('env', 'NAUTOBOT_URL') }}"
      token: "{{ lookup('env', 'NAUTOBOT_TOKEN') }}"

    # AWX injects awx_job_id (tower_job_id is the legacy alias) into every job.
    # On a local run neither exists, and the 'local-run' fallback makes that
    # visible in the change log.
    job_ref: "{{ awx_job_id | default(tower_job_id | default('local-run')) }}"

  tasks:
    - name: Gather facts from the device
      # hardware  -> ansible_net_serialnum, ansible_net_model, ansible_net_version
      # interfaces -> ansible_net_neighbors (LLDP)
      arista.eos.eos_facts:
        gather_subset:
          - hardware
          - interfaces

    - name: Show what the device reported
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          version={{ ansible_net_version | default('unknown') }},
          serial={{ ansible_net_serialnum | default('(none)') }},
          model={{ ansible_net_model | default('unknown') }},
          lldp_neighbors={{ ansible_net_neighbors | default({}) | length }}

    # SoftwareVersion is a Nautobot object, not a free-text field, so it must
    # exist before a device can reference it.
    #
    # throttle: 1 is required. Both leaves run the same EOS build and
    # SoftwareVersion is unique on (platform, version); run in parallel, both
    # hosts would try to create it and one would fail with a UniqueViolation.
    # Only this task is serialised.
    - name: Ensure the discovered software version exists in Nautobot
      networktocode.nautobot.software_version:
        <<: *nb
        version: "{{ ansible_net_version }}"
        platform: Arista EOS
        status: Active
        state: present
      delegate_to: localhost
      throttle: 1
      when: ansible_net_version is defined

    - name: Write serial, software version, and the AWX job ID back to the device
      networktocode.nautobot.device:
        <<: *nb
        name: "{{ inventory_hostname }}"
        serial: "{{ ansible_net_serialnum | default(omit) }}"
        software_version: "{{ ansible_net_version | default(omit) }}"
        custom_fields:
          awx_job_id: "{{ job_ref }}"
          lldp_neighbors: "{{ ansible_net_neighbors | default({}) }}"
        state: present
      delegate_to: localhost
      register: writeback

    - name: Confirm, and point at the change log
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}
          {{ 'UPDATED' if writeback.changed else 'already matched' }} in Nautobot
          (job ref: {{ job_ref }}). See Extensibility -> Change Log.

# ---------------------------------------------------------------------------
# Why LLDP neighbours go into a custom field rather than Cable objects
#
# Modelling discovered neighbours as dcim.Cable is the fuller answer, but it
# needs interface-name normalisation (Et1 vs Ethernet1), handling of existing
# cables, both termination types and the right status. A JSON custom field
# captures the same data in one task. Creating real cables is a stretch goal.
# ---------------------------------------------------------------------------
