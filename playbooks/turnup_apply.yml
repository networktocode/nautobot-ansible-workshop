---
# Lab 4, node 3 of the `Site Turnup (gated)` workflow.
#
# The only node in the workflow that changes anything. It applies the config
# that node 1 showed the approver, then writes discovered state back to
# Nautobot so the change log carries the AWX job ID.
#
# It runs only after approval. That is enforced by the workflow's edge from the
# approval node, not here: if the approval is denied or times out, AWX never
# starts this node.
#
# `apply: true` is set in the AWX job template's extra_vars, not here.
# diff_intent.yml defaults to check mode, so the same playbook backs both node 1
# (preview) and node 3 (apply), and the approver sees the change that is made.
#
# How to run by hand:
#   ansible-playbook -i inventory/nautobot.yml playbooks/turnup_apply.yml -u admin -k -e device_name=leaf1 -e apply=true --limit leaf1
#
# Tested with Nautobot 3.2.3 and AWX 24.6.1.

# `hosts: all`, not `hosts: localhost`, so the play is inside the job's limit
# (see turnup_diff.yml). A skipped play here would skip the no-op guard below.
- name: Announce what was approved
  hosts: all
  gather_facts: false

  tasks:
    - name: Announce
      run_once: true
      delegate_to: localhost
      block:
        - name: Report
          ansible.builtin.debug:
            msg:
              - "Approved — applying to {{ device_name | default('the workflow limit') }}."
              - "Mode: {{ 'APPLY (changes will be made)' if (apply | default(false) | bool) else 'CHECK ONLY — apply is not set, nothing will change' }}"
              - "AWX job: {{ awx_job_id | default('local-run') }}"

        # Without `apply: true` the node would change nothing yet report
        # success, and the record would say an approved change was applied.
        - name: Refuse to run as a no-op
          ansible.builtin.assert:
            that: apply | default(false) | bool
            fail_msg: >-
              apply is not true, so this node would change nothing while still
              reporting success — which would put a false "approved and applied"
              entry in the audit trail. Set `apply: true` in the extra_vars of
              the `Site Turnup - apply and write back` job template.

# Same playbook node 1 used, with apply=true this time.
- name: Apply the approved configuration
  ansible.builtin.import_playbook: diff_intent.yml

# Lab 3's playbook, unchanged. It picks up awx_job_id from AWX automatically, so
# the Nautobot change log entry names the workflow job that made the change.
- name: Write discovered state back to Nautobot
  ansible.builtin.import_playbook: write_back.yml
