; Static inventory used in the cold open. Lab 1 replaces it with the Nautobot
; dynamic inventory plugin. It is maintained by hand, so it goes stale as soon
; as a device changes.
;
; ansible_host values match the mgmt-ipv4 addresses pinned in
; clab/workshop.clab.yml and the addresses in the Nautobot seed data. All three
; must agree.

[leaf]
leaf1 ansible_host=172.20.20.11
leaf2 ansible_host=172.20.20.12

[leaf:vars]
ansible_network_os=arista.eos.eos
ansible_connection=ansible.netcommon.network_cli
ansible_become=yes
ansible_become_method=enable

; Force paramiko rather than libssh. ansible.netcommon prefers libssh when
; ansible-pylibssh is installed, and libssh ignores the [paramiko_connection]
; look_for_keys setting in ansible.cfg that prevents "Too many authentication
; failures". Remove this line only if you use libssh and stop key offering
; another way.
ansible_network_cli_ssh_type=paramiko
