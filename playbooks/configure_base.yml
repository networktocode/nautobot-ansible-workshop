---
# Lab 0 — base configuration from a static inventory and an AWX survey.
#
# This playbook does not change for the rest of the workshop. Lab 1 swaps the
# inventory underneath it; Lab 2 swaps where the variables come from. The
# playbook staying identical is the point.

- name: Base configuration
  hosts: all
  gather_facts: false

  pre_tasks:
    # An AWX survey cannot collect a list, so it collects flat values
    # (ntp_primary, ntp_secondary, dns_server) and set_fact builds the lists the
    # template expects.
    #
    # This must be set_fact, not play `vars:`, which would be a self-reference
    # ("recursive loop detected in template string"). set_fact outranks
    # group_vars; when the survey vars are absent (local run) it is skipped.
    - name: Build NTP list from survey answers
      ansible.builtin.set_fact:
        ntp_servers: "{{ [ntp_primary, ntp_secondary] | reject('none') | list }}"
      when: ntp_primary is defined

    - name: Build DNS list from survey answers
      ansible.builtin.set_fact:
        dns_servers: "{{ [dns_server] }}"
      when: dns_server is defined

    - name: Sanity check — required variables are present
      ansible.builtin.assert:
        that:
          - ntp_servers | default([]) | length > 0
          - dns_servers | default([]) | length > 0
          - snmp_community is defined
          - syslog_host is defined
        fail_msg: >-
          Missing base config variables. Running locally? Check that
          inventory/group_vars/leaf.yml sits beside the inventory file, not at
          the repo root. Running from AWX? Check the survey is enabled and
          answered, and that the inventory source synced the group_vars.

  tasks:
    - name: Push base config
      arista.eos.eos_config:
        src: ../templates/base.j2
      register: result

    - name: Show what changed
      ansible.builtin.debug:
        var: result.updates
      when: result.updates is defined
