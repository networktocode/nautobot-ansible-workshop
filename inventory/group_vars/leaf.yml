---
# Device config data for the `leaf` group.
#
# This file sits beside the inventory (inventory/group_vars/), not at the repo
# root: Ansible resolves group_vars relative to the inventory or the playbook,
# and a copy at the repo root would be silently ignored.
#
# Lab 2 deletes this file and serves the same data from Nautobot Config
# Contexts. The key names match, so the template does not change.

ntp_servers:
  - 10.0.0.1
  - 10.0.0.2

dns_servers:
  - 10.0.0.53

snmp_community: public
mgmt_vrf: MGMT
syslog_host: 10.0.0.10
