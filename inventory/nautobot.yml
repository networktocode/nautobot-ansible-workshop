---
# Nautobot dynamic inventory (Lab 1), replacing static.ini.
#
# This file is intentionally executable (mode 755). AWX's Inventory-file
# dropdown lists only files named `inventory`/`hosts`, files ending in `.ini`,
# or executable files, so a plugin-based .yml inventory appears there only with
# the exec bit set:
#   chmod +x inventory/nautobot.yml
#   git update-index --chmod=+x inventory/nautobot.yml
# The workshop itself does not rely on this: both AWX Inventories are
# pre-created, and the labs switch the Job Template's Inventory field instead.
#
# Usage (locally):
#   export NAUTOBOT_URL="http://localhost:8001"
#   export NAUTOBOT_TOKEN="<token>"
#   ansible-inventory -i inventory/nautobot.yml --graph
#   ansible-inventory -i inventory/nautobot.yml --host leaf1
#
# The same playbook then runs unchanged against this inventory:
#   ansible-playbook -i inventory/nautobot.yml playbooks/configure_base.yml -u admin -k --check --diff
#
# api_endpoint and token are deliberately not set here. The plugin reads
# NAUTOBOT_URL and NAUTOBOT_TOKEN from the environment, which keeps the token
# out of git and lets the same file work locally and in AWX, where a custom
# credential injects a URL reachable from inside the cluster.

plugin: networktocode.nautobot.inventory

validate_certs: false

# Pull Config Contexts into hostvars (off by default). Lab 2 depends on it.
config_context: true

# Place Config Context keys directly on the host (for example `ntp_servers`)
# rather than under a nested `config_context` dict. templates/base.j2 then
# resolves the same variables whether they come from group_vars/leaf.yml or
# from Config Contexts, so the template does not change in Lab 2.
flatten_config_context: true

# ---------------------------------------------------------------- group naming
# These two options decide the group names, and therefore whether
# inventory/group_vars/leaf.yml applies.
#
# plurals: false gives singular group_by names (location, role, platform) and
# plain hostvars. The default (true) requires plural group_by names and wraps
# every hostvar in a single-element list for legacy compatibility.
plurals: false

# group_names_raw: true drops the "role_" / "location_" prefix, so the role
# group is `leaf` rather than `role_leaf` and group_vars/leaf.yml matches it.
# With the default (false), group_vars/leaf.yml would match nothing.
group_names_raw: true

group_by:
  - location
  - role
  - platform

# ------------------------------------------------------------------- host vars
# compose values are Jinja2 expressions, not plain values. Keep only values
# derived from Nautobot here. Static connection settings (ansible_connection,
# ansible_network_os, ansible_become) live in inventory/group_vars/all.yml,
# because a bare YAML boolean such as `ansible_become: true` does not template
# reliably in compose and is silently dropped.
compose:
  # primary_ip4.address is in CIDR form ("172.20.20.11/24"); Ansible needs the
  # bare address. A plain split avoids depending on ipaddr/netaddr.
  ansible_host: primary_ip4.address.split('/')[0]

# --------------------------------------------------------------- var renaming
# The plugin's `tags` hostvar collides with Ansible's reserved `tags` and
# triggers "[WARNING]: Found variable using reserved name 'tags'". Renaming it
# removes the warning.
rename_variables:
  - pattern: "^tags$"
    repl: "nautobot_tags"

# ---------------------------------------------------------------------- filters
# To restrict the inventory to Active devices, uncomment the two lines below
# (remove the "# " from each). Nothing else needs changing.
#
# Use the mapping form shown. Although the option is declared `elements: str`,
# the plugin drops any entry that is not a single-key mapping, with only a
# warning, so a string such as "status=active" silently filters nothing.
#
# The value is case-sensitive: `Active`, not `active`. Nautobot 3.x filters
# status by name, and a wrong case makes the API return
#     {"status":["Select a valid choice. active is not one of the available choices."]}
# The inventory then fails to parse, and the last line printed is "Unable to
# parse ... as an inventory source". The actual error is on the `auto plugin`
# line above it.
# device_query_filters:
#   - status: Active
