---
# Lab 1 — target a Nautobot Dynamic Group.
#
# The networktocode.nautobot inventory plugin cannot expose Dynamic Groups as
# inventory groups (they are not among its `group_by` choices), so a Job
# Template's Limit cannot name one. Instead, this play resolves membership at
# runtime from /api/extras/dynamic-groups/<pk>/members/ and builds an Ansible
# group with add_host. Nautobot still owns the definition of "which devices":
# change the filter in Nautobot and this play targets a different set.
#
# How to run:
#   export NAUTOBOT_URL="http://localhost:8001"
#   export NAUTOBOT_TOKEN="<token>"
#   ansible-playbook -i inventory/nautobot.yml playbooks/target_dynamic_group.yml -e dynamic_group_name="leaf-devices-dc1" -u admin -k
#
# These hosts already exist in the Nautobot inventory, so add_host only adds
# them to a new group; their hostvars (ansible_host, config_context, ...) remain.

- name: Resolve Dynamic Group membership into an Ansible group
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    dynamic_group_name: leaf-devices-dc1
    target_group: dg_target
    nb_headers:
      Authorization: "Token {{ lookup('env', 'NAUTOBOT_TOKEN') }}"
      Accept: application/json

  tasks:
    - name: Look up the Dynamic Group by name
      ansible.builtin.uri:
        url: >-
          {{ lookup('env', 'NAUTOBOT_URL') }}/api/extras/dynamic-groups/?name={{ dynamic_group_name | urlencode }}
        headers: "{{ nb_headers }}"
        return_content: true
      register: dg_lookup

    - name: Fail clearly if the group does not exist
      ansible.builtin.assert:
        that: dg_lookup.json.count == 1
        fail_msg: >-
          Dynamic Group '{{ dynamic_group_name }}' not found (matched
          {{ dg_lookup.json.count }}). Check Organization -> Dynamic Groups in
          Nautobot, and that its content type is dcim.device.

    - name: Fetch its members
      # limit=0 disables pagination in Nautobot's API — returns every member.
      ansible.builtin.uri:
        url: >-
          {{ lookup('env', 'NAUTOBOT_URL') }}/api/extras/dynamic-groups/{{ dg_lookup.json.results[0].id }}/members/?limit=0
        headers: "{{ nb_headers }}"
        return_content: true
      register: dg_members

    - name: Show what Nautobot says the target set is
      ansible.builtin.debug:
        msg: >-
          '{{ dynamic_group_name }}' has {{ dg_members.json.results | length }}
          member(s): {{ dg_members.json.results | map(attribute='name') | join(', ') }}

    - name: Build the Ansible group from those members
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: "{{ target_group }}"
      loop: "{{ dg_members.json.results }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

- name: Act only on the Dynamic Group's members
  hosts: dg_target
  gather_facts: false

  tasks:
    - name: Prove targeting worked, and that hostvars survived add_host
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} ({{ ansible_host }}) — targeted via Nautobot
          Dynamic Group membership.

    # Swap this for the real work once targeting is confirmed:
    #
    # - name: Push base config
    #   arista.eos.eos_config:
    #     src: ../templates/base.j2
