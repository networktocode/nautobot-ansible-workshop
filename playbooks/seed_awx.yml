---
# Create every AWX object the labs need; the counterpart to seed_nautobot.yml.
#
# Runs against localhost and talks to AWX's /api/v2/ through the awx.awx
# collection. It touches no devices. On the Nautobot side it creates Lab 4's
# webhook and gives Nautobot's worker the AWX connection details for Lab 3.
#
# Run:
#   ansible-playbook playbooks/seed_awx.yml
#
# No environment variables or --extra-vars are required. The AWX URL and login
# are the same on every lab stack (http://localhost:8013, admin/admin), so they
# are literal defaults rather than required env vars, which would vanish in a
# new SSH session, under sudo, cron or systemd. CONTROLLER_HOST,
# CONTROLLER_USERNAME and CONTROLLER_PASSWORD still override them if set.
#
# awx_url is localhost because this runs on the VM, alongside the
# `kubectl port-forward`. AWX jobs reach Nautobot at a different address; see
# nautobot_url_from_pods below.
#
# Safe to re-run: every object is restored to the state the labs expect. The
# one exception is the AWX token, which is minted anew on each run.
#
# Order matters, and awx.awx does not resolve it:
#   credential_type -> credentials -> project -> inventories
#   -> inventory_sources -> job_templates -> workflow -> webhook

- name: Seed AWX with the workshop objects
  hosts: localhost
  connection: local
  gather_facts: false

  # Connection settings for every awx.awx module in the play. `controller` is
  # an action group declared in the collection's meta/runtime.yml, and it
  # covers every module used here.
  module_defaults:
    group/awx.awx.controller:
      controller_host: "{{ awx_url }}"
      controller_username: "{{ awx_username }}"
      controller_password: "{{ awx_password }}"
      validate_certs: false

  vars:
    # Static literals, overridable by the env vars. An unset env var comes back
    # as "" rather than undefined, so `| default(x, true)` is needed to treat
    # the empty string as unset; a bare `| default(x)` would not.
    awx_url: "{{ lookup('env', 'CONTROLLER_HOST') | default('http://localhost:8013', true) }}"
    awx_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('admin', true) }}"
    awx_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') | default('admin', true) }}"

    org: Default
    project_name: Nautobot Ansible Workshop
    scm_url: https://github.com/networktocode/nautobot-ansible-workshop.git
    scm_branch: main

    # Built from ee/execution-environment.yml and loaded into minikube with
    # `minikube -p awx image load`. No registry is involved, so the tag must
    # match the loaded image exactly.
    ee_name: workshop-ee
    ee_image: "workshop-ee:1.0.0"

    # The URL AWX execution pods use to reach Nautobot, which is not the one
    # you use from the VM. AWX runs in Kubernetes and Nautobot on the host, so
    # this is the minikube gateway, stable only because the minikube network is
    # created with --subnet=192.168.49.0/24. Check it with:
    #   minikube -p awx ssh -- ip route | grep default
    nautobot_url_from_pods: http://192.168.49.1:8001
    nautobot_token: "0123456789abcdef0123456789abcdef01234567"

    # Nautobot as seen from this playbook on the VM. AWX pods use
    # nautobot_url_from_pods above; the correct address for a service depends
    # on who is asking.
    nautobot_url_local: "{{ lookup('env', 'NAUTOBOT_URL') | default('http://localhost:8001', true) }}"

    # How Nautobot runs on this host:
    #
    #   compose   nautobot-docker-compose: Nautobot is a set of containers.
    #             The default.
    #   native    systemd services from a venv under /opt/nautobot, as in the
    #             prebuilt workshop image.
    #
    # The two differ only in the address Nautobot uses to reach AWX, the file
    # the AWX connection details are written to, and how Nautobot is restarted
    # to pick them up. The workshop image sets NAUTOBOT_DEPLOYMENT=native in the
    # workshop user's shell profile, so no extra arguments are needed there.
    nautobot_deployment: "{{ lookup('env', 'NAUTOBOT_DEPLOYMENT') | default('compose', true) }}"
    nautobot_env_file_native: /opt/nautobot/nautobot.env

    # The address Nautobot uses to reach AWX, for both Lab 3's Job Button and
    # Lab 4's webhook. Deliberately not a bridge-gateway IP, which would depend
    # on Docker network creation order.
    #
    # compose  host.docker.internal resolves inside the containers to the
    #          compose bridge gateway, which is the host.
    # native   Nautobot runs on the host, but localhost does not work: Nautobot
    #          3.x rejects loopback webhook URLs as SSRF protection.
    #          192.168.49.1 is the host's address on minikube's network,
    #          private rather than loopback, and it reaches the port-forward,
    #          which listens on 0.0.0.0:8013.
    awx_url_from_nautobot: "{{ 'http://192.168.49.1:8013' if nautobot_deployment == 'native' else 'http://host.docker.internal:8013' }}"

    device_username: admin
    device_password: admin

  tasks:
    - name: Check NAUTOBOT_DEPLOYMENT is a shape this playbook knows
      ansible.builtin.assert:
        that: nautobot_deployment in ['compose', 'native']
        fail_msg: >-
          NAUTOBOT_DEPLOYMENT is '{{ nautobot_deployment }}'. It must be
          'compose' (nautobot-docker-compose, the default) or 'native'
          (systemd services under /opt/nautobot, as in the workshop image).
        quiet: true

    # Pre-flight check on the port-forward. It is a foreground process that
    # stops on SSH disconnect and on reboot, and without it every awx.awx task
    # fails with a connection error that names the module rather than the
    # cause. /api/v2/ping/ is unauthenticated, so this proves reachability only.
    - name: Check AWX is reachable before doing anything else
      ansible.builtin.uri:
        url: "{{ awx_url }}/api/v2/ping/"
        method: GET
        validate_certs: false
        timeout: 10
      register: awx_ping
      failed_when: false
      changed_when: false

    - name: Explain it if AWX is not answering
      ansible.builtin.assert:
        that: awx_ping.status == 200
        fail_msg: >-
          No answer from AWX at {{ awx_url }} (got {{ awx_ping.status }}).
          Almost always the port-forward: it is a foreground process and does
          not survive a reboot or an SSH disconnect. Restart it with
          `nohup kubectl -n awx port-forward --address 0.0.0.0 svc/awx-service 8013:80 > /tmp/awx-port-forward.log 2>&1 &`
          then re-run this playbook.
        success_msg: "AWX {{ awx_ping.json.version | default('?') }} answering at {{ awx_url }}"

    # ------------------------------------------------- custom credential type
    # Inputs are the form fields; the injector is how they reach the job.
    # inventory/nautobot.yml hardcodes neither URL nor token: the plugin reads
    # NAUTOBOT_URL and NAUTOBOT_TOKEN from the environment, and this injector
    # sets them at runtime, so the same file works locally and inside AWX.
    - name: Credential type — Nautobot API
      awx.awx.credential_type:
        name: Nautobot API
        kind: cloud
        description: >-
          Injects NAUTOBOT_URL and NAUTOBOT_TOKEN into a job's environment.
        inputs:
          fields:
            - id: nautobot_url
              type: string
              label: Nautobot URL
            - id: nautobot_token
              type: string
              label: Nautobot Token
              secret: true
          required:
            - nautobot_url
            - nautobot_token
        injectors:
          env:
            NAUTOBOT_URL: "{% raw %}{{ nautobot_url }}{% endraw %}"
            NAUTOBOT_TOKEN: "{% raw %}{{ nautobot_token }}{% endraw %}"
        state: present

    # The {% raw %} above is required. Those braces are AWX's own templating
    # over the field ids, evaluated at job launch; without raw, Ansible would
    # resolve them here and write empty strings into the injector.

    # ------------------------------------------------------------ credentials
    - name: Credential — Nautobot API
      awx.awx.credential:
        name: Nautobot API
        organization: "{{ org }}"
        credential_type: Nautobot API
        inputs:
          nautobot_url: "{{ nautobot_url_from_pods }}"
          nautobot_token: "{{ nautobot_token }}"
        state: present

    - name: Credential — cEOS admin
      awx.awx.credential:
        name: cEOS admin
        organization: "{{ org }}"
        credential_type: Machine
        inputs:
          username: "{{ device_username }}"
          password: "{{ device_password }}"
          become_method: enable
        state: present

    # ----------------------------------------------- execution environment
    # The stock EE cannot run this workshop: quay.io/ansible/awx-ee:24.6.1 ships
    # ansible-core 2.15.12, while networktocode.nautobot needs >= 2.17.0 and
    # arista.eos >= 2.16.0, and it lacks pynautobot and paramiko. See
    # ee/execution-environment.yml.
    #
    # AWX registers an EE whose image does not exist without complaint; the
    # failure surfaces later as ImagePullBackOff on the first job. Check first.
    - name: Check the custom EE image is loaded into minikube
      ansible.builtin.command: minikube -p awx image ls
      register: mk_images
      changed_when: false
      failed_when: false

    - name: Explain it if the EE image was never built or loaded
      ansible.builtin.assert:
        that: ee_image in (mk_images.stdout | default(''))
        fail_msg: >-
          {{ ee_image }} is not loaded into the awx minikube profile, so every
          job would fail with ImagePullBackOff. Build and load it:
          `/opt/ansible/bin/pip install ansible-builder==3.1.1` then
          `cd ~/nautobot-ansible-workshop/ee && /opt/ansible/bin/ansible-builder build --tag {{ ee_image }} --container-runtime docker`
          then `minikube -p awx image load {{ ee_image }}`.
          See 15-single-stack.md section 2b.
        success_msg: "{{ ee_image }} is present in the awx minikube profile."

    # `pull: missing` is the default, stated explicitly for a locally built
    # image: `always` would make AWX fetch it from a registry that lacks it.
    - name: Execution environment — workshop-ee
      awx.awx.execution_environment:
        name: "{{ ee_name }}"
        image: "{{ ee_image }}"
        organization: "{{ org }}"
        pull: missing
        state: present

    # ---------------------------------------------------------------- project
    # default_environment sets the EE in one place. AWX resolves an EE as job
    # template -> project -> organization -> global default, so the project is
    # the narrowest scope that covers all of this workshop's templates.
    - name: Project — Nautobot Ansible Workshop
      awx.awx.project:
        name: "{{ project_name }}"
        organization: "{{ org }}"
        scm_type: git
        scm_url: "{{ scm_url }}"
        scm_branch: "{{ scm_branch }}"
        scm_update_on_launch: true
        scm_clean: true
        default_environment: "{{ ee_name }}"
        wait: true
        state: present

    # Sync before creating job templates. awx.awx.job_template validates
    # `playbook` against the file list from the project's last successful sync,
    # so a playbook added since then fails with "Playbook not found for
    # project." The project task only syncs on creation, and
    # `scm_update_on_launch` only syncs when a job launches. Cheap on a re-run
    # when the SCM revision has not moved.
    - name: Sync the project so AWX can see any newly added playbooks
      awx.awx.project_update:
        project: "{{ project_name }}"
        organization: "{{ org }}"
        wait: true
        timeout: 300

    # ------------------------------------------------------------ inventories
    # Both are pre-created. In Lab 1 the attendee switches the Job Template's
    # Inventory field from one to the other, a plain object dropdown. AWX's
    # inventory *file* picker (could_be_inventory()) only offers .ini,
    # executables, or files named exactly inventory/hosts, so a .yml plugin
    # config may not appear there at all.
    - name: Inventory — Static (Lab 0)
      awx.awx.inventory:
        name: Static (Lab 0)
        organization: "{{ org }}"
        description: The hand-maintained inventory the cold open throws away.
        state: present

    - name: Inventory — Nautobot (Lab 1)
      awx.awx.inventory:
        name: Nautobot (Lab 1)
        organization: "{{ org }}"
        description: Sourced from Nautobot. Same playbook, no static file.
        state: present

    - name: Inventory source — static.ini
      awx.awx.inventory_source:
        name: static.ini
        inventory: Static (Lab 0)
        source: scm
        source_project: "{{ project_name }}"
        source_path: inventory/static.ini
        overwrite: true
        update_on_launch: true
        state: present

    # The Nautobot credential is attached here so the inventory plugin gets
    # NAUTOBOT_URL / NAUTOBOT_TOKEN during the sync.
    - name: Inventory source — nautobot.yml
      awx.awx.inventory_source:
        name: nautobot.yml
        inventory: Nautobot (Lab 1)
        source: scm
        source_project: "{{ project_name }}"
        source_path: inventory/nautobot.yml
        credential: Nautobot API
        overwrite: true
        update_on_launch: true
        state: present

    # Populate the inventory now rather than relying on `update_on_launch`,
    # which only fires when a job runs against it. Otherwise a fresh stack shows
    # Nautobot (Lab 1) with zero hosts and Lab 1's first check looks broken.
    # reset_lab.yml performs the same sync.
    - name: Sync the Nautobot inventory source
      awx.awx.inventory_source_update:
        name: nautobot.yml
        inventory: Nautobot (Lab 1)
        organization: "{{ org }}"
        wait: true
        timeout: 120

    # --------------------------------------------------------- job templates
    # Lab 0. The survey is the problem the cold open demonstrates: six facts
    # Nautobot already holds, retyped by hand, with no validation and no history.
    #
    # The survey fields are deliberately empty and required. Defaults would let
    # an attendee launch without typing anything, removing both the tedium and
    # the room for an unvalidated typo that Lab 2's Config Context Schema later
    # prevents. The values are printed in the Lab 0 guide. With no default and
    # `required: true`, AWX will not launch until all six are filled.
    - name: Job template — Onboard Site (survey)
      awx.awx.job_template:
        name: Onboard Site (survey)
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/configure_base.yml
        inventory: Static (Lab 0)
        credentials:
          - cEOS admin
        become_enabled: true
        survey_enabled: true
        survey_spec:
          name: ""
          description: Every field here is a fact Nautobot already knows.
          spec:
            - question_name: Site name
              variable: site_name
              type: text
              required: true
            - question_name: Primary NTP server
              variable: ntp_primary
              type: text
              required: true
            - question_name: Secondary NTP server
              variable: ntp_secondary
              type: text
              required: true
            - question_name: SNMP community
              variable: snmp_community
              type: text
              required: true
            - question_name: DNS server
              variable: dns_server
              type: text
              required: true
            - question_name: Syslog host
              variable: syslog_host
              type: text
              required: true
        state: present

    # No ask_inventory_on_launch on this template, deliberately:
    #
    # 1. In Lab 1 the attendee edits the template, changes Inventory to
    #    "Nautobot (Lab 1)" and saves. A launch-time prompt would let them pick
    #    it in the launch dialog instead and skip that step.
    # 2. A launch-time choice is not persisted. The template would still say
    #    "Static (Lab 0)", and Labs 2-4 would silently run against it.
    #
    # The template's Inventory field is the single place that decides, which is
    # also what reset_lab.yml relies on. The other ask_* flags below are
    # required: ask_variables_on_launch for the Job Button's and webhook's
    # extra_vars, and ask_limit_on_launch for the webhook's `limit`.

    # Lab 1. A survey that does not duplicate the source of truth: it asks
    # which set to act on, a human decision Nautobot cannot make. Multiple
    # choice rather than text, so there is nothing to mistype.
    - name: Job template — Configure Dynamic Group members
      awx.awx.job_template:
        name: Configure Dynamic Group members
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/target_dynamic_group.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - cEOS admin
          - Nautobot API
        become_enabled: true
        survey_enabled: true
        survey_spec:
          name: ""
          description: ""
          spec:
            - question_name: Which Nautobot Dynamic Group should this target?
              variable: dynamic_group_name
              type: multiplechoice
              choices:
                - leaf-devices-dc1
              default: leaf-devices-dc1
              required: true
        state: present

    # Lab 2. Reads Nautobot only, with no device credential, so it runs even with
    # the switches powered off.
    - name: Job template — Render intent
      awx.awx.job_template:
        name: Render intent
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/render_intent.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - Nautobot API
        state: present

    - name: Job template — Diff intent vs device
      awx.awx.job_template:
        name: Diff intent vs device
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/diff_intent.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - cEOS admin
          - Nautobot API
        become_enabled: true
        state: present

    # Lab 3. ask_variables_on_launch is required: the Nautobot Job Button POSTs
    # extra_vars (device_name, device_id, device_location) and AWX silently
    # discards them unless the template accepts prompted variables.
    - name: Job template — Write back to Nautobot
      awx.awx.job_template:
        name: Write back to Nautobot
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/write_back.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - cEOS admin
          - Nautobot API
        become_enabled: true
        ask_variables_on_launch: true
        state: present

    # ------------------------------------------------- Lab 4: the gated workflow
    # Two job templates and a three-node workflow, which the Nautobot webhook
    # launches.
    #
    # ask_variables_on_launch and ask_limit_on_launch are required on both job
    # templates and on the workflow. AWX silently drops prompted values at any
    # level that has not opted in, so a workflow that accepts a limit whose
    # nodes do not would run against the whole inventory and report success.
    - name: Job template — Site Turnup check and diff
      awx.awx.job_template:
        name: Site Turnup - check and diff
        description: >-
          Lab 4 node 1. Re-reads the device's status from Nautobot, stops if it
          is not Active, then renders intent and diffs it in check mode. Runs
          BEFORE the approval node so the approver has a diff to read.
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/turnup_diff.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - cEOS admin
          - Nautobot API
        become_enabled: true
        ask_variables_on_launch: true
        ask_limit_on_launch: true
        state: present

    # apply: true is set here, not in the playbook. turnup_apply.yml imports the
    # same diff_intent.yml that node 1 runs, which defaults to check mode. Job
    # template extra_vars override play vars, so this flag is the only
    # difference between "show me" and "do it", and the approver sees the
    # output of the same code path that makes the change.
    - name: Job template — Site Turnup apply and write back
      awx.awx.job_template:
        name: Site Turnup - apply and write back
        description: >-
          Lab 4 node 3. Applies the configuration the approver saw, then writes
          discovered state back to Nautobot. Only runs if the approval node was
          approved.
        organization: "{{ org }}"
        project: "{{ project_name }}"
        playbook: playbooks/turnup_apply.yml
        inventory: Nautobot (Lab 1)
        credentials:
          - cEOS admin
          - Nautobot API
        become_enabled: true
        extra_vars:
          apply: true
        ask_variables_on_launch: true
        ask_limit_on_launch: true
        state: present

    - name: Workflow — Site Turnup (gated)
      awx.awx.workflow_job_template:
        name: Site Turnup (gated)
        description: >-
          Lab 4. Launched by the Nautobot webhook when a device is updated.
          Checks the trigger, diffs, waits for a human, then applies.
        organization: "{{ org }}"
        inventory: Nautobot (Lab 1)
        ask_variables_on_launch: true
        ask_limit_on_launch: true
        state: present
      register: wfjt

    # Nodes first, links second. A node cannot reference a sibling that does
    # not exist yet, so success_nodes is set in a second pass once all three
    # exist. This follows the collection's documented pattern for approval
    # workflows.
    - name: Workflow node 1 — check and diff
      awx.awx.workflow_job_template_node:
        identifier: turnup-check
        workflow_job_template: Site Turnup (gated)
        organization: "{{ org }}"
        unified_job_template: Site Turnup - check and diff
        state: present

    # The only node that runs no code. `timeout: 0` means it waits indefinitely,
    # which suits a lab where an attendee may take a while to get here.
    # Lab 4's stretch goal asks them to set a real timeout and watch it expire.
    - name: Workflow node 2 — the approval gate
      awx.awx.workflow_job_template_node:
        identifier: turnup-approval
        workflow_job_template: Site Turnup (gated)
        organization: "{{ org }}"
        approval_node:
          name: Approve site turn-up
          description: >-
            Read node 1's diff before approving. Approving applies that
            configuration to the device and writes state back to Nautobot.
          timeout: 0
        state: present

    - name: Workflow node 3 — apply and write back
      awx.awx.workflow_job_template_node:
        identifier: turnup-apply
        workflow_job_template: Site Turnup (gated)
        organization: "{{ org }}"
        unified_job_template: Site Turnup - apply and write back
        state: present

    # success_nodes, not always_nodes. If node 1 decides this was not a turn-up,
    # or the diff fails, nobody is asked to approve anything.
    - name: Link check → approval
      awx.awx.workflow_job_template_node:
        identifier: turnup-check
        workflow_job_template: Site Turnup (gated)
        organization: "{{ org }}"
        success_nodes:
          - turnup-approval
        state: present

    # An approval node "succeeds" when approved and "fails" when denied or timed
    # out, so success_nodes here is exactly "only if a human said yes".
    - name: Link approval → apply
      awx.awx.workflow_job_template_node:
        identifier: turnup-approval
        workflow_job_template: Site Turnup (gated)
        organization: "{{ org }}"
        success_nodes:
          - turnup-apply
        state: present

    # --------------------------------------------- OAuth2 token (Labs 3 and 4)
    # The one credential that cannot be pinned to a literal: AWX generates it,
    # so it is created here and carried to Nautobot, whose Job Button (Lab 3)
    # and webhook (Lab 4) authenticate to AWX with it.
    #
    # Not idempotent. The value is returned only at creation, so every run
    # mints a new token and earlier ones stay valid. `state: absent` needs
    # existing_token or existing_token_id, and no module lists tokens; clean up
    # in the AWX UI (Administration -> Users -> admin -> Tokens) or via
    # /api/v2/tokens/. Harmless on a lab stack.
    - name: Create the AWX token for Nautobot
      awx.awx.token:
        description: nautobot-ansible-workshop
        scope: write
        state: present
      register: awx_token

    # -------------------------------------------- Lab 4: the Nautobot webhook
    # A Nautobot object created by the AWX seed, on purpose: it needs the
    # workflow's id and the AWX token, which exist only once AWX is seeded.
    # networktocode.nautobot has no webhook module, so this uses the REST API
    # with the same look-then-POST-or-PATCH pattern as seed_nautobot.yml.
    #
    # This block runs before the Nautobot restart below. The restart returns
    # once containers exist, but Django takes another 30-60s to serve requests.
    # Nothing here needs the restart, and Nautobot is still serving.
    - name: Look for an existing device-status webhook
      ansible.builtin.uri:
        url: "{{ nautobot_url_local }}/api/extras/webhooks/?name=device-status-change"
        method: GET
        headers: &nb_hdrs
          Authorization: "Token {{ nautobot_token }}"
          Accept: application/json
          Content-Type: application/json
        status_code: 200
      register: webhook_lookup
      # Covers Nautobot restarting or migrating from an earlier step; not a
      # substitute for the ordering above.
      retries: 12
      delay: 10
      until: webhook_lookup is succeeded

    # body_template is a Jinja2 template that Nautobot renders at send time
    # against its own context (event, timestamp, model, username, request_id,
    # data, snapshots), so every `{{ ... }}` below must reach Nautobot untouched.
    #
    # `!unsafe`, not `{% raw %}`: raw protects a single render pass. This value
    # passes through set_fact into a later task, which would template it again
    # (failing on Nautobot's `data` variable) and could literal_eval the
    # dict-like string into a dict, which Nautobot's API rejects. `!unsafe`
    # prevents templating at any depth. Use `{% raw %}` for a value consumed in
    # the same task, as in the credential injector, and `!unsafe` for one that
    # passes through a variable.
    #
    # `status_changed` breaks a feedback loop. Approving runs write_back.yml,
    # which updates the device, which fires this webhook again:
    #
    #   status -> Active --> webhook --> workflow --> approve --> write_back
    #                 ^                                               |
    #                 +-------------- device updated -----------------+
    #
    # Nautobot webhooks have no condition field, but
    # `snapshots.differences.added` is keyed by the fields that changed in this
    # event. The write-back never changes status, so turnup_diff.yml stops the
    # workflow when this is false and the loop ends after one short run.
    #
    # `limit` targets the workflow at the device that changed. The status
    # itself is not sent: in `data`, related objects carry only
    # id/object_type/url, so it would render empty. turnup_diff.yml re-reads it
    # from Nautobot instead.
    - name: Build the webhook definition
      ansible.builtin.set_fact:
        webhook_body:
          name: device-status-change
          content_types:
            - dcim.device
          type_create: false
          type_update: true
          type_delete: false
          enabled: true
          payload_url: "{{ awx_url_from_nautobot }}/api/v2/workflow_job_templates/{{ wfjt.id }}/launch/"
          http_method: POST
          http_content_type: application/json
          additional_headers: "Authorization: Bearer {{ awx_token.ansible_facts.controller_token.token }}"
          ssl_verification: false
          body_template: !unsafe |
            {
              "extra_vars": {
                "device_name": "{{ data.name }}",
                "device_id": "{{ data.id }}",
                "nautobot_event": "{{ event }}",
                "nautobot_timestamp": "{{ timestamp }}",
                "nautobot_request_id": "{{ request_id }}",
                "changed_by": "{{ username }}",
                "status_changed": "{{ 'status' in ((snapshots or {}).get('differences') or {}).get('added', {}) }}"
              },
              "limit": "{{ data.name }}"
            }

    # If body_template were ever converted to a dict, the API call would fail
    # with a 400 naming a serializer field rather than the cause.
    - name: Confirm the body template survived as an unrendered string
      ansible.builtin.assert:
        that:
          - webhook_body.body_template is string
          - "'data.name' in webhook_body.body_template"
        fail_msg: >-
          body_template was templated or type-converted before reaching
          Nautobot. The `!unsafe` tag on it has been lost.
        success_msg: body_template is an unrendered string, as Nautobot needs.

    - name: Create the webhook
      ansible.builtin.uri:
        url: "{{ nautobot_url_local }}/api/extras/webhooks/"
        method: POST
        headers: *nb_hdrs
        body_format: json
        body: "{{ webhook_body }}"
        status_code: 201
      when: (webhook_lookup.json.results | default([])) | length == 0

    # PATCH rather than skip: the token is new on every run, so an existing
    # webhook carries a stale Authorization header and would get a 401 from
    # AWX, a failure Nautobot does not surface.
    - name: Update the existing webhook with the current token and workflow id
      ansible.builtin.uri:
        url: "{{ nautobot_url_local }}/api/extras/webhooks/{{ (webhook_lookup.json.results | first).id }}/"
        method: PATCH
        headers: *nb_hdrs
        body_format: json
        body: "{{ webhook_body }}"
        status_code: 200
      when: (webhook_lookup.json.results | default([])) | length == 1


    # ------------------------------------- Lab 3: AWX access for the worker
    # The Job Button's receive_job_button() runs in the celery worker, which
    # reads AWX_HOST, AWX_TOKEN and AWX_JOB_TEMPLATE from its environment. How
    # that is set depends on nautobot_deployment; exactly one of the two blocks
    # below runs. Both use blockinfile so a re-run replaces the block in place
    # rather than appending stale AWX_TOKEN lines.

    # ---- compose
    #
    # Written to creds.env rather than a new file, which would need a manual
    # compose change. nautobot-docker-compose loads exactly two env files, in
    # environments/docker-compose.base.yml:
    #
    #     x-nautobot-base: &nautobot-base
    #       env_file:
    #         - "local.env"
    #         - "creds.env"
    #
    # and `nautobot`, `celery_worker` and `celery_beat` all merge that anchor,
    # so creds.env reaches the worker with no compose edit. creds.env rather
    # than local.env because AWX_TOKEN is a credential.
    - name: Put the AWX connection details where the celery worker will see them (compose)
      ansible.builtin.blockinfile:
        path: "{{ lookup('env', 'HOME') }}/nautobot-docker-compose/environments/creds.env"
        marker: "# {mark} ANSIBLE MANAGED BLOCK — workshop AWX access"
        create: true
        mode: "0600"
        block: |
          AWX_HOST={{ awx_url_from_nautobot }}
          AWX_TOKEN={{ awx_token.ansible_facts.controller_token.token }}
          AWX_JOB_TEMPLATE=Write back to Nautobot
      register: awx_env
      when: nautobot_deployment == 'compose'

    # `docker compose restart` is not enough: it keeps the environment the
    # container was created with. `invoke start` (docker compose up -d)
    # recreates the containers once the env file has changed. invoke is called
    # by full path because PATH may not include the /opt/ansible venv.
    - name: Recreate the Nautobot containers so they pick up the new environment (compose)
      ansible.builtin.shell: /opt/ansible/bin/invoke stop && /opt/ansible/bin/invoke start
      args:
        chdir: "{{ lookup('env', 'HOME') }}/nautobot-docker-compose"
      when: nautobot_deployment == 'compose' and awx_env is changed
      changed_when: true

    # Verify on the worker, not the web container: the worker is what the Job
    # Button uses. The container name is {project}-{service}-1, and
    # nautobot-docker-compose pins the project to "nautobot_docker_compose".
    - name: Confirm the celery worker can actually see AWX_HOST (compose)
      ansible.builtin.command: docker exec nautobot_docker_compose-celery_worker-1 printenv AWX_HOST
      register: worker_env
      changed_when: false
      failed_when: awx_url_from_nautobot not in (worker_env.stdout | default(''))
      retries: 12
      delay: 10
      until: worker_env is succeeded
      when: nautobot_deployment == 'compose'

    # ---- native
    #
    # The three Nautobot units (nautobot, nautobot-worker, nautobot-scheduler)
    # each load /opt/nautobot/nautobot.env as their systemd EnvironmentFile, so
    # that is the one file to write. It belongs to the `nautobot` user, hence
    # become — the workshop user has passwordless sudo on the image.
    #
    # The job-template name is quoted here and not in the compose block: systemd
    # strips the quotes, and quoting a value with spaces is the unambiguous form
    # for an EnvironmentFile.
    - name: Put the AWX connection details in Nautobot's environment file (native)
      ansible.builtin.blockinfile:
        path: "{{ nautobot_env_file_native }}"
        marker: "# {mark} ANSIBLE MANAGED BLOCK — workshop AWX access"
        block: |
          AWX_HOST={{ awx_url_from_nautobot }}
          AWX_TOKEN={{ awx_token.ansible_facts.controller_token.token }}
          AWX_JOB_TEMPLATE="Write back to Nautobot"
      become: true
      register: awx_env_native
      when: nautobot_deployment == 'native'

    # A systemd restart re-reads the EnvironmentFile, so unlike compose there
    # is no "restart is not enough" trap here.
    - name: Restart the Nautobot services so they pick up the new environment (native)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: restarted
      loop:
        - nautobot
        - nautobot-worker
        - nautobot-scheduler
      become: true
      when: nautobot_deployment == 'native' and awx_env_native is changed

    # Same reasoning as the compose check: read the worker's live environment,
    # not the file. /proc/<pid>/environ is what the running process actually
    # has; MainPID is 0 until the restart settles, which the retries absorb.
    - name: Confirm the celery worker can actually see AWX_HOST (native)
      ansible.builtin.shell: >-
        set -o pipefail &&
        tr '\0' '\n' < /proc/$(systemctl show -p MainPID --value nautobot-worker)/environ
        | grep '^AWX_HOST='
      args:
        executable: /bin/bash
      become: true
      register: worker_env_native
      changed_when: false
      failed_when: awx_url_from_nautobot not in (worker_env_native.stdout | default(''))
      retries: 12
      delay: 10
      until: worker_env_native is succeeded
      when: nautobot_deployment == 'native'

    # ------------------------------------------------------------ verification
    - name: Next step
      ansible.builtin.debug:
        msg:
          - "AWX seeded, including Lab 4's workflow and the Nautobot webhook."
          - "Sync the project and the Nautobot inventory source, then confirm both hosts appear:"
          - "  Resources -> Inventories -> Nautobot (Lab 1) -> Hosts"
          - "Lab 4 end to end: set a device's status to Active in Nautobot and watch"
          - "  Site Turnup (gated) start on its own under AWX -> Jobs."
          - "Webhook target: {{ awx_url_from_nautobot }}/api/v2/workflow_job_templates/{{ wfjt.id }}/launch/"
