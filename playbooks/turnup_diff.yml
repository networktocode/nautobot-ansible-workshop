---
# Lab 4, node 1 of the `Site Turnup (gated)` workflow.
#
# A Nautobot webhook fires on any device update, so this node first asks
# Nautobot what is true now and decides whether the event is worth acting on.
# Only then does it render intent and diff it against the device, in check mode.
#
# Why it re-reads Nautobot instead of trusting the webhook payload:
#   1. The payload does not carry the status name. Related objects are
#      serialised as `{"id": ..., "object_type": ..., "url": ...}`, so
#      `{{ data.status.name }}` in the webhook body would render empty.
#   2. A webhook is a notification, not a source of truth. By the time it is
#      delivered it may be stale, so the automation asks the source of truth
#      what is true now.
#
# Nautobot webhooks have no condition field, so filtering which events matter
# has to happen downstream. This play is where it happens.
#
# How to run by hand (AWX normally supplies device_name and the limit):
#   ansible-playbook -i inventory/nautobot.yml playbooks/turnup_diff.yml -u admin -k -e device_name=leaf1 --limit leaf1
#
# Tested with Nautobot 3.2.3 and AWX 24.6.1.

# `hosts: all`, not `hosts: localhost`, so the play is inside the job's limit.
# AWX launches this with `--limit leaf1`, and `--limit` applies to every play: a
# `localhost` play would match nothing and be skipped rather than failed, letting
# the workflow reach the approval node with nothing checked. The work is done
# once via `run_once` + `delegate_to: localhost`.
- name: Decide whether this event is a site turn-up
  hosts: all
  gather_facts: false

  vars:
    nb_url: "{{ lookup('env', 'NAUTOBOT_URL') | default('http://localhost:8001', true) }}"
    nb_token: "{{ lookup('env', 'NAUTOBOT_TOKEN') | default('0123456789abcdef0123456789abcdef01234567', true) }}"

    # The status that means "this device is ready to be turned up". Anything
    # else and the workflow stops here, before the approval node, so nobody is
    # asked to approve a change that was never going to happen.
    turnup_status: Active

  tasks:
    # One decision for the whole run: `run_once` because the answer does not
    # vary per host; `delegate_to: localhost` because these are API calls.
    - name: Check the trigger
      run_once: true
      delegate_to: localhost
      block:
        - name: Fail clearly if the trigger did not name a device
          ansible.builtin.assert:
            that: device_name is defined and device_name | length > 0
            fail_msg: >-
              No device_name was supplied. This playbook is normally launched by
              the Nautobot webhook, which passes it in extra_vars. To run it by
              hand, add `-e device_name=leaf1`.

        # depth=1 expands related objects one level, so `status` has a name.
        - name: Ask Nautobot what this device's status is NOW
          ansible.builtin.uri:
            url: "{{ nb_url }}/api/dcim/devices/?name={{ device_name | urlencode }}&depth=1"
            method: GET
            headers:
              Authorization: "Token {{ nb_token }}"
              Accept: application/json
            status_code: 200
          register: device_lookup

        - name: Fail clearly if the device is not in Nautobot
          ansible.builtin.assert:
            that: (device_lookup.json.results | default([])) | length == 1
            fail_msg: >-
              Expected exactly one device named '{{ device_name }}' in Nautobot,
              found {{ (device_lookup.json.results | default([])) | length }}.

        # Loop breaker: stop unless this event changed the status.
        #
        # Node 3 runs write_back.yml, which updates the device in Nautobot and
        # so fires the same webhook again. The webhook passes `status_changed`,
        # derived from `snapshots.differences.added` (the fields that moved in
        # this event). The write-back never touches status, so the workflow it
        # triggers stops here without touching a device.
        #
        # `default('true')` so a manual launch with `-e device_name=...` still
        # works.
        - name: Stop unless the status is what changed
          ansible.builtin.assert:
            that: status_changed | default('true') | bool
            fail_msg: >-
              This event changed {{ device_name }} but not its status, so it is
              not a site turn-up and the workflow stops here. **This is the
              expected result after a write-back** — node 3 updates the device,
              which fires the same webhook again. Stopping here is what stops
              that becoming a loop. Nothing was changed and nobody was asked to
              approve anything.
            success_msg: >-
              The status changed in this event — this is a real trigger, not
              an echo of our own write-back.

        - name: Report the trigger
          ansible.builtin.debug:
            msg:
              - "Device:          {{ device_name }}"
              - "Status now:      {{ (device_lookup.json.results | first).status.name }}"
              - "Changed by:      {{ changed_by | default('unknown') }}"
              - "Nautobot event:  {{ nautobot_event | default('unknown') }} at {{ nautobot_timestamp | default('unknown') }}"
              - "Request ID:      {{ nautobot_request_id | default('unknown') }}"

        # A deliberate, explanatory failure: the node goes red in the AWX
        # visualizer and the workflow ends before the approval node.
        - name: Stop unless this is a turn-up
          ansible.builtin.assert:
            that: (device_lookup.json.results | first).status.name == turnup_status
            fail_msg: >-
              {{ device_name }} is
              '{{ (device_lookup.json.results | first).status.name }}', not
              '{{ turnup_status }}' — so this edit is not a site turn-up and the
              workflow stops here. Nothing was changed and nobody was asked to
              approve anything. This is the expected result for any device edit
              that is not a turn-up.
            success_msg: >-
              {{ device_name }} is {{ turnup_status }} — proceeding to render
              intent and diff it against the device.

# Reuses Lab 2's playbook. It defaults to check mode (`apply: false`), so this
# node calculates the change without making it. The approver reads its output.
- name: Render intent and diff it against the device
  ansible.builtin.import_playbook: diff_intent.yml
