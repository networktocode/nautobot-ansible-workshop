[defaults]
# cEOS nodes are recreated often in a lab, so host keys change. Do not carry
# this setting into production.
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = ansible.builtin.default
callback_result_format = yaml
retry_files_enabled = False

[persistent_connection]
# network_cli against cEOS can be slow to establish on first connect.
command_timeout = 60
connect_timeout = 60

[paramiko_connection]
# Required for password auth against cEOS.
#
# Without look_for_keys = False, the client offers every key in ~/.ssh and in
# ssh-agent before trying the password. Each offer counts against the device's
# MaxAuthTries (OpenSSH default 6), so with a few keys loaded you get:
#
#   Failed to authenticate public key: Received SSH_MSG_DISCONNECT:
#   2:Too many authentication failures
#
# This looks like a wrong password, but password auth was never reached. `-k`
# only supplies the password; it does not stop keys being offered.
#
# `[ssh_connection] ssh_args` has no effect here: network_cli uses paramiko or
# libssh, not OpenSSH.
look_for_keys = False
host_key_auto_add = True
