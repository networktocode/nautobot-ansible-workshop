# ContainerLab topology: two Arista cEOS nodes.
#
# Import the image first (cEOS ships as a filesystem tarball, so use
# `docker import`, not `docker load`):
#   docker import cEOSarm-lab-4.33.10M.tar.xz ceos:4.33.10M
#   docker image inspect ceos:4.33.10M --format '{{.Architecture}}/{{.Os}}'
#
# Deploy:
#   sudo containerlab deploy -t clab/workshop.clab.yml
#   sudo containerlab inspect -t clab/workshop.clab.yml
#
# Management IPs are pinned with `mgmt-ipv4`, and the labs, static.ini and the
# Nautobot seed data use them as literals. Without the pin, ContainerLab
# assigns addresses in start order, which can differ between runs.
#
# The import example uses the ARM64 cEOS build (Apple Silicon). On x86_64,
# import the non-ARM image of the same version (4.33.10M) under the same tag.

name: workshop

mgmt:
  network: clab-workshop
  ipv4-subnet: 172.20.20.0/24

topology:
  nodes:
    leaf1:
      kind: arista_ceos
      image: ceos:4.33.10M
      mgmt-ipv4: 172.20.20.11
      restart-policy: always
    leaf2:
      kind: arista_ceos
      image: ceos:4.33.10M
      mgmt-ipv4: 172.20.20.12
      restart-policy: always

  links:
    - endpoints: ["leaf1:eth1", "leaf2:eth1"]
