# awx/kustomization.yaml
#
#   kubectl apply -k awx/
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1

images:
  # Required: upstream's config/manager/kustomization.yaml sets `newTag: latest`
  # for the operator image, so without this override the ?ref=2.19.1 manifests
  # would run whatever :latest currently points at.
  - name: quay.io/ansible/awx-operator
    newTag: 2.19.1

  # Required: 2.19.1 hardcodes gcr.io/kubebuilder/kube-rbac-proxy:v0.15.0 in
  # config/default/manager_auth_proxy_patch.yaml, and that image is no longer
  # available from gcr.io. Remap it to quay.io/brancz/kube-rbac-proxy, which
  # still carries v0.15.0; otherwise the operator pod stays at 1/2 with
  # ImagePullBackOff.
  - name: gcr.io/kubebuilder/kube-rbac-proxy
    newName: quay.io/brancz/kube-rbac-proxy
    newTag: v0.15.0

namespace: awx
