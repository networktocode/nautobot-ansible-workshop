---
# Connection settings for every host, from either inventory.
#
# These live here rather than in the inventory plugin's `compose:` block
# because compose values are Jinja2 expressions: a bare YAML boolean such as
# `ansible_become: true` does not template reliably there and is silently
# dropped, which surfaces only as "operation requires privilege escalation".
# compose holds values derived from Nautobot; static settings belong here.
#
# Lab 2 relies on this split:
#   group_vars/all.yml   -> connection settings   (permanent)
#   group_vars/leaf.yml  -> device config data    (deleted in Lab 2, replaced
#                                                  by Config Contexts)

ansible_connection: ansible.netcommon.network_cli
ansible_network_os: arista.eos.eos

# Force paramiko rather than libssh. ansible.netcommon prefers ansible-pylibssh
# when it is installed, and libssh ignores `[paramiko_connection] look_for_keys
# = False` in ansible.cfg, the setting that prevents "Too many authentication
# failures" against cEOS. static.ini sets this for the static inventory; this
# covers the Nautobot inventory used from Lab 1 on.
ansible_network_cli_ssh_type: paramiko

# cEOS: admin lands at a privilege level that still needs `enable` for config
# mode. Without both of these, eos_config fails with
# "operation requires privilege escalation".
ansible_become: true
ansible_become_method: enable
